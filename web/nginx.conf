server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed Vite assets are immutable; index.html must never be cached or the
    # browser keeps loading the previous build's asset names after a redeploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /api/ {
        # nginx resolves a literal proxy_pass hostname once at startup and
        # caches it forever, so restarting the api container (new IP) would
        # 502 until nginx was restarted too. Going through a variable forces
        # re-resolution per request via Docker's embedded DNS.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream api:8000;
        proxy_pass http://$api_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Poster generation can take a while; don't cut the request short.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA fallback — client-side routing serves index.html for unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
